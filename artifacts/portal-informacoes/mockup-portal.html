function trackingPage(){return centralWrap(`<div class="section-heading"><h2>Tracking de carga</h2></div><p class="small muted" style="margin-bottom:20px">Selecione um BL para acessar o rastreamento no site do armador.</p><section class="card pad"><form id="tracking-form"><div class="field"><label for="tracking-bl">BL para consulta</label><select id="tracking-bl">${bls.map(b=>`<option value="${b.id}">${b.id} · ${b.pod} · ${b.ship}</option>`).join('')}</select></div><div class="buttons" style="margin-top:18px"><button class="button primary">${icon('external')}Rastrear no armador</button><button type="button" class="button" onclick="copy(document.querySelector('#tracking-bl').value,'BL fictício copiado.')">${icon('copy')}Copiar BL</button></div></form><p class="helper">O rastreamento abre em outra aba no site do armador. Caso necessário, cole o número do BL na consulta.</p></section><section class="card section"><div class="card-head"><h3>Meus BLs</h3></div>${table(['BL','Navio / viagem','Destino',''],bls.map(b=>`<tr><td><a class="mono" href="#bl/${b.id}">${b.id}</a></td><td>${b.ship}<small>${b.voyage}</small></td><td>${b.pod}</td><td><button class="button small" onclick="tracking('${b.id}')">${icon('external')}Tracking</button></td></tr>`))}</section>`,'tracking')}
function profilePage(){return `${title('Perfil','Dados cadastrais e contatos para recebimento de comunicados.')}<div class="layout"><form class="card pad" id="profile-form"><h2>Contatos e recebimento</h2><p class="small muted" style="margin-top:8px">Contato principal da Aurora Comércio Ltda.</p><div class="grid two section">${field('Nome','profile-name','', 'Marina Costa')}${field('E-mail de contato','profile-email','', 'marina@aurora.example')}${field('Telefone','profile-phone','', '(00) 00000-0400')}${field('Cargo','profile-role','', 'Analista de importação')}</div><div class="section"><h3>Receber comunicados</h3><div class="buttons" style="margin-top:14px">${['Operação','Financeiro','Demurrage'].map(l=>`<label class="pill blue" style="padding:9px"><input type="checkbox" checked style="width:auto;min-height:0"> ${l}</label>`).join('')}</div></div><button class="button primary" style="margin-top:23px">Salvar contatos</button></form><aside><div class="card pad"><h3>Dados cadastrais</h3><div class="list-row"><div><div class="small muted">Razão social</div><strong>Aurora Comércio Ltda.</strong></div></div><div class="list-row"><div><div class="small muted">CNPJ fictício</div><strong class="mono">00.000.000/0001-00</strong></div></div><div class="list-row"><div><div class="small muted">Endereço fictício</div><span class="small">Av. das Indústrias, 500<br>Vitória/ES</span></div></div></div><div class="card pad section"><h3>E-mail de Recuperação</h3><p class="small muted" style="margin:12px 0">financeiro@aurora.example</p><button class="button small" onclick="modal('Alterar E-mail de Recuperação','<p>Fluxo demonstrativo. Na implementação, a troca exigirá confirmação da identidade e do novo endereço.</p>')">Alterar e-mail</button></div></aside></div>`}
function loginPage(){return `<div class="login card pad"><div class="eyebrow muted">Portal do Cliente</div><h1 style="margin-top:10px">Acesse seu Portal</h1><p class="small muted" style="margin-top:10px">Consulte suas faturas e acompanhe suas operações.</p><form id="login-form">${field('CNPJ','login-cnpj','', '00.000.000/0001-00')}<div class="field"><label for="login-password">Senha</label><input id="login-password" type="password" value="demonstracao"></div><button class="button primary">Entrar na demonstração ${icon('arrow')}</button></form><p class="helper">Acesso fictício. Nenhuma credencial será enviada.</p><button class="button subtle" onclick="toast('Recuperação de senha ilustrativa. Use Entrar na demonstração.')">Esqueci minha senha</button></div>`}
function emptyPage(message){return `<section class="card pad"><h2>${message}</h2><div class="buttons section">${btn('Voltar ao Painel','painel',true)}</div></section>`}
function render(){clearTimeout(toastTimer);document.querySelector('#toast').hidden=true;currentRoute=decodeURIComponent(location.hash.slice(1)||'painel');const parts=currentRoute.split('/'),root=parts[0];const nav=[['painel','Painel','home'],['faturas/local','Faturas','file'],['operacao/bls','BLs e Containers','box'],['central','Central de Informações','book'],['perfil','Perfil','user']];document.querySelector('#nav').innerHTML=nav.map(([r,l,i])=>`<a href="#${r}" class="${r.split('/')[0]===root||root==='bl'&&r.startsWith('operacao')||root==='fatura'&&r.startsWith('faturas')||root==='devolucao'&&r==='central'?'active':''}">${icon(i)}${l}</a>`).join('');document.querySelector('.nav-wrap').hidden=root==='login';let html;if(root==='painel')html=dashboard();else if(root==='operacao'){operationTab=parts[1]==='containers'?'containers':'bls';html=operation()}else if(root==='bl')html=blPage(parts[1]);else if(root==='faturas'){billingTab=parts[1]==='demurrage'?'demurrage':'local';html=billing()}else if(root==='fatura')html=invoicePage(parts[1]);else if(root==='devolucao')html=returnPage(parts[1]);else if(root==='perfil')html=profilePage();else if(root==='login')html=loginPage();else if(root==='central'){html=({taxas:taxesPage,devolucao:returnSearch,demurrage:demurragePage,agentes:()=>agentsPage(parts[2]),atendimento:supportPage,tracking:trackingPage}[parts[1]]||centralHome)()}else html=emptyPage('Página não encontrada');document.querySelector('#main').innerHTML=html;document.title=(document.querySelector('main h1')?.textContent||'Portal')+' · Portal FWLOG · Mockup';wire(parts);window.scrollTo(0,0)}
function wire(parts){if(document.querySelector('#op-form')){operationRows();document.querySelector('#op-form').onsubmit=e=>{e.preventDefault();operationRows()};for(const id of ['op-port','op-status'])document.getElementById(id).onchange=operationRows}if(document.querySelector('#bill-form')){billRows();document.querySelector('#bill-form').onsubmit=e=>{e.preventDefault();billRows()};document.querySelector('#bill-status').onchange=billRows}if(document.querySelector('#tax-port')){if(ports.includes(parts[2]))document.querySelector('#tax-port').value=parts[2];for(const id of ['tax-port','tax-mode','tax-profile'])document.getElementById(id).onchange=taxRows;taxRows()}if(document.querySelector('#dep-port')){const refresh=()=>{document.querySelector('#general-depots').innerHTML=depots.filter(d=>d.port===document.querySelector('#dep-port').value).map(depotCard).join('')};document.querySelector('#dep-port').onchange=refresh;refresh()}if(document.querySelector('#return-form'))document.querySelector('#return-form').onsubmit=e=>{e.preventDefault();const v=document.querySelector('#return-number').value.trim().toUpperCase();if(containers.some(c=>c.id===v)){returnScenario='saved';go('devolucao/'+v)}else document.querySelector('#return-error').innerHTML=`<div class="notice blue" style="margin-top:16px">Nenhum container encontrado entre suas operações. Confira a numeração ou selecione uma unidade abaixo.</div>`};if(document.querySelector('#return-scenario')){document.querySelector('#return-scenario').value=returnScenario;document.querySelector('#return-scenario').onchange=e=>{returnScenario=e.target.value;render()}}if(document.querySelector('#agent-port')){document.querySelector('#agent-port').onchange=agentRows;agentRows()}if(document.querySelector('#tracking-form'))document.querySelector('#tracking-form').onsubmit=e=>{e.preventDefault();tracking(document.querySelector('#tracking-bl').value)};if(document.querySelector('#profile-form'))document.querySelector('#profile-form').onsubmit=e=>{e.preventDefault();toast('Contatos salvos nesta demonstração. Nenhum dado foi enviado.')};if(document.querySelector('#login-form'))document.querySelector('#login-form').onsubmit=e=>{e.preventDefault();go('painel')}}
function modal(name,body){document.querySelector('#dialog-title').textContent=name;document.querySelector('#dialog-body').innerHTML=body;const d=document.querySelector('#dialog');if(!d.open)d.showModal()}
function closeDialog(){document.querySelector('#dialog').close()}
function toast(message){const el=document.querySelector('#toast');clearTimeout(toastTimer);el.textContent=message;el.hidden=false;toastTimer=setTimeout(()=>el.hidden=true,4500)}
async function copy(value,message='Copiado.'){try{await navigator.clipboard.writeText(value);toast(message)}catch{modal('Copiar informação',`<p class="small muted">Selecione e copie o conteúdo abaixo.</p><input readonly value="${esc(value)}" style="margin-top:16px" onclick="this.select()">`)}}
function contactDialog(team,bl='',cntr=''){let email=team==='Containers'?'eqp@fwlog.example':team==='Exportação'?'exportacao@fwlog.example':team==='Importação'?'importacao@fwlog.example':'contato@fwlog.example';modal('Contato · '+team,`<p class="small muted">O Portal prepara o contato com o contexto da sua operação.</p><div class="field"><label>Destinatário fictício</label><input value="${email}" readonly></div><div class="field"><label for="email-subject">Assunto</label><input id="email-subject" value="${esc(team+(bl?' · BL '+bl:'')+(cntr?' · '+cntr:''))}"></div><div class="field"><label for="email-body">Mensagem</label><textarea id="email-body" rows="4">Olá, gostaria de orientação${cntr?' sobre a devolução do container '+cntr:bl?' sobre o BL '+bl:'.'}.</textarea></div><div class="buttons"><button class="button primary" onclick="toast('Demonstração: aqui seria aberto seu aplicativo de e-mail. Nenhuma mensagem foi enviada.')">${icon('mail')}Abrir no aplicativo de e-mail</button></div><p class="helper">Envio simulado no mockup. Os destinatários são fictícios.</p>`)}
function tracking(bl){modal('Rastrear no armador',`<p>Consulta do BL <strong class="mono">${esc(bl)}</strong></p><div class="notice blue" style="margin-top:18px">O site do armador será aberto em outra aba. Se o BL não for preenchido automaticamente, cole-o no campo de consulta.</div><div class="field"><label>BL selecionado</label><input readonly value="${esc(bl)}"></div><div class="buttons"><button class="button" onclick="copy('${bl}','BL fictício copiado.')">${icon('copy')}Copiar BL</button><button class="button primary" onclick="toast('Tracking simulado: o mockup não abre consultas externas com BLs fictícios.')">${icon('external')}Abrir site do armador</button></div><p class="helper">Neste mockup, o acesso externo é simulado.</p>`)}
function depotAction(id){const d=depots.find(d=>d.id===id);if(d.mode==='email'){modal('Agendamento · '+d.name,`<p>${d.instruction}</p><div class="field"><label>Destinatário fictício</label><input readonly value="${d.email}"></div><div class="field"><label>Container</label><input value="${currentRoute.startsWith('devolucao/')?returnSelection:''}" placeholder="Informe a unidade"></div><div class="field"><label for="schedule-date">Data desejada</label><input id="schedule-date" type="date" value="2026-10-05"></div><div class="buttons"><button class="button primary" onclick="toast('Solicitação ilustrativa preparada. Aguarde a confirmação do depot antes de transportar a unidade.')">${icon('mail')}Preparar e-mail de agendamento</button></div><p class="helper">Nenhuma solicitação será enviada nesta demonstração.</p>`)}else modal(d.mode==='portal'?'Portal de agendamento · '+d.name:'Documentos para devolução',`<p>${d.instruction}</p><div class="notice blue" style="margin-top:18px">${d.mode==='portal'?'Na implementação, o Portal abrirá o endereço de agendamento cadastrado para este depot.':'Tenha em mãos a liberação do terminal e a identificação do container.'}</div><p class="helper">Acesso demonstrativo; nenhum agendamento foi realizado.</p>`)}
function mapDialog(id){const d=depots.find(d=>d.id===id);modal('Localização · '+d.name,`<div style="height:160px;background:repeating-linear-gradient(0deg,#eeeae2 0,#eeeae2 30px,#d7d3ca 31px,#eeeae2 33px);display:grid;place-items:center;border-radius:7px;color:var(--blue)">${icon('pin')}<strong>${d.name}</strong></div><p style="margin-top:18px">${d.address}</p><p class="helper">Endereço fictício. O botão de localização abrirá o mapa do depot na implementação.</p>`)}
function whatsapp(){modal('Atendimento por WhatsApp','<p>Na implementação, este botão abrirá o WhatsApp da FWLOG com o contexto da operação.</p><p class="helper">Contato fictício neste mockup. Nenhuma mensagem foi enviada.</p>')}
function notifications(){modal('Notificações',`<div class="list-row"><div><strong>Orientação de devolução atualizada</strong><p class="small muted">O container AURU2345678 deve ser devolvido no Terminal Enseada.</p><div class="buttons" style="margin-top:10px">${btn('Ver orientação','devolucao/AURU2345678',false,'pin')}</div></div></div><div class="list-row"><div><strong>Fatura de Demurrage disponível</strong><p class="small muted">Consulte os detalhes da fatura DM-2026-0042.</p><div class="buttons" style="margin-top:10px">${btn('Ver fatura','fatura/DM-2026-0042',false,'file')}</div></div></div>`)}
function showScenarios(){modal('Explore o mockup',`<p class="small muted">Escolha uma jornada para avaliar a proposta. Todos os dados são fictícios.</p><div class="list-row"><div><strong>Devolução pela regra geral</strong><p class="small muted">Escolha entre os depots do porto de Vitória.</p></div>${btn('Abrir','devolucao/AURU1234567',false,'pin')}</div><div class="list-row"><div><strong>Devolução com indicação específica</strong><p class="small muted">Somente o Terminal Enseada está indicado para a unidade.</p></div>${btn('Abrir','devolucao/AURU2345678',false,'pin')}</div><div class="list-row"><div><strong>Container em Demurrage</strong><p class="small muted">Prazo excedido e indicação específica em Salvador.</p></div>${btn('Abrir','devolucao/AURU3456789',false,'clock')}</div><div class="list-row"><div><strong>Central completa</strong><p class="small muted">Taxas, depots, agentes, atendimento e tracking.</p></div>${btn('Abrir','central',false,'book')}</div><p class="helper">Na tela de devolução, use a área de avaliação para simular alterações de indicação no Vela.</p>`)}
document.querySelector('#dialog').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog()}});
document.addEventListener('click',e=>{const link=e.target.closest('a[href^="#"]');if(link&&link.getAttribute('href')!=='#main'){const next=link.getAttribute('href').slice(1);if(next.startsWith('devolucao/'))returnScenario='saved';if(document.querySelector('#dialog').open)closeDialog();if(location.hash===link.getAttribute('href'))render()}});
window.addEventListener('hashchange',render);document.querySelector('#bell-icon').innerHTML=icon('bell');render();
</script>
</body>
</html>
