name: Provision Cloudflare Pages projects

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-project-provisioning
  cancel-in-progress: false

jobs:
  provision:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Mesmo environment do token de Pages (auditoria run-2, #14).
    environment: cloudflare-pages
    steps:
      - name: Checkout trusted provisioning code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Create only missing empty Pages projects
        env:
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/cloudflare-pages-provision.mjs
