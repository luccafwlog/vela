name: Provision Preview Admin

# Este workflow usa workflow_run de propósito: ele executa a versão do arquivo
# presente na branch padrão, nunca o YAML alterado pela PR. Assim, os secrets
# nunca ficam disponíveis para código fornecido por uma PR externa.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: preview-admin-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  provision:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0].head.repo.id == github.event.repository.id &&
      github.event.workflow_run.pull_requests[0].number
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_HEAD_REF: ${{ github.event.workflow_run.pull_requests[0].head.ref }}
      PR_HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      # Cópia sob nome próprio: o step "Load branch credentials" despeja a saída
      # do CLI em $GITHUB_ENV, e uma chave `SUPABASE_PROJECT_REF` vinda de lá
      # sobrescreveria o ref de produção. O guard do script compara a URL
      # resolvida contra ESTE valor e recusa provisionar em produção.
      PRODUCTION_SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      PREVIEW_ADMIN_EMAIL: qa-admin@example.test
      PREVIEW_ADMIN_FULL_NAME: Preview Admin
      PREVIEW_ADMIN_PASSWORD: ${{ secrets.PREVIEW_ADMIN_PASSWORD }}
    steps:
      # workflow_run executa no contexto padrão; explicitar a branch impede que
      # o script seja substituído pelo conteúdo não confiável da PR.
      - name: Checkout trusted provisioning code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Validate PR branch before using it with Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          : "${PR_HEAD_REF:?PR_HEAD_REF ausente}"
          [[ "$PR_HEAD_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || {
            echo 'Nome de branch inesperado; recusando passá-lo ao Supabase CLI.'
            exit 1
          }

      - name: Wait for Supabase Preview readiness
        id: readiness
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          : "${PR_NUMBER:?PR_NUMBER ausente}"
          : "${PR_HEAD_SHA:?PR_HEAD_SHA ausente}"
          : "${PR_HEAD_REF:?PR_HEAD_REF ausente}"
          decide() {
            OPEN="$1" CURRENT_SHA="$2" CONCLUSION="$3" BRANCH_READY="$4" node --input-type=module -e "
              import { decidePreviewReadiness } from './scripts/preview-readiness.mjs';
              const conclusion = process.env.CONCLUSION || null;
              process.stdout.write(decidePreviewReadiness({
                open: process.env.OPEN === 'true',
                currentSha: process.env.CURRENT_SHA,
                requestedSha: '${PR_HEAD_SHA}',
                conclusion,
                branchReady: process.env.BRANCH_READY === 'true',
              }));"
          }
          poll_state() {
            pr_state="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.state')"
            pr_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
            # Paginação explícita: o filtro --jq do gh avalia por página, então
            # o raw paginado é reduzido com jq -s para o SHA exato solicitado.
            payload="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${PR_HEAD_SHA}/check-runs?per_page=100")"
            # O nome do check é controlado pelo emissor. Exigir o app oficial
            # Supabase (ID estável da integração) evita que outro check com o
            # mesmo nome autorize credenciais de uma branch.
            read -r check_status check_conclusion <<<"$(jq -sr --arg sha "${PR_HEAD_SHA}" '
              [.[].check_runs[] | select(.name == "Supabase Preview" and .head_sha == $sha and .app.id == 330661 and .app.slug == "supabase")]
              | if length == 0 then ["", ""]
                else (max_by(.completed_at // .started_at // .created_at) | [.status, (.conclusion // "")])
                end | join(" ")' <<<"$payload")"
            branch_ready=false
            if [[ "$check_conclusion" == "success" ]]; then
              if supabase --experimental branches get "$PR_HEAD_REF" --project-ref "$SUPABASE_PROJECT_REF" -o env >/dev/null 2>&1; then
                branch_ready=true
              fi
            fi
            pr_open=false
            if [[ "$pr_state" == "open" ]]; then pr_open=true; fi
            decision="$(decide "$pr_open" "$pr_sha" "$check_conclusion" "$branch_ready")"
            printf '%s|%s|%s|%s\n' "$decision" "$check_status" "$check_conclusion" "$branch_ready"
          }
          for attempt in $(seq 1 36); do
            IFS='|' read -r decision check_status check_conclusion branch_ready <<<"$(poll_state)"
            case "$decision" in
              ready)
                # Revalidar SHA e estado antes de provisionar: cobre merge/fechamento durante a espera.
                pr_state="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.state')"
                pr_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
                if [[ "$pr_state" == "open" && "$pr_sha" == "$PR_HEAD_SHA" ]]; then
                  echo "readiness=ready" >> "$GITHUB_OUTPUT"
                  echo "Preview pronta para a PR #${PR_NUMBER} no SHA ${PR_HEAD_SHA}."
                  exit 0
                fi
                echo "SHA/estado mudou durante a espera (state=${pr_state} sha=${pr_sha}); reavaliando."
                ;;
              obsolete)
                echo "readiness=obsolete" >> "$GITHUB_OUTPUT"
                echo "PR #${PR_NUMBER} encerrada ou SHA superado; concluindo sem credenciais e sem provisionar."
                exit 0
                ;;
              failed)
                echo "Supabase Preview terminou com '${check_conclusion}' para o SHA ${PR_HEAD_SHA} na PR #${PR_NUMBER}; abortando sem provisionar."
                exit 1
                ;;
              investigate)
                echo "Supabase Preview pulado (skipped) com a PR #${PR_NUMBER} aberta no SHA ${PR_HEAD_SHA}; causa exige investigação, skip não é sucesso. Abortando sem provisionar."
                exit 1
                ;;
              wait)
                echo "Aguardando Supabase Preview ($attempt/36): status='${check_status:-missing}' conclusion='${check_conclusion:-missing}' branch_ready=${branch_ready:-false}"
                ;;
            esac
            sleep 10
          done
          echo "Tempo limite (36 tentativas) aguardando o Supabase Preview para o SHA ${PR_HEAD_SHA} na PR #${PR_NUMBER}; último estado: status='${check_status:-missing}' conclusion='${check_conclusion:-missing}'."
          exit 1

      - name: Load branch credentials
        if: steps.readiness.outputs.readiness == 'ready'
        # O `-o env` do CLI emite formato dotenv (`KEY="valor"`). O $GITHUB_ENV
        # espera `KEY=valor` cru e não remove aspas: anexar sem decodificar
        # deixava cada credencial com aspas literais e o provisionamento
        # quebrava em `Invalid supabaseUrl` (PR 652). O pipefail acima garante
        # que uma falha do CLI também reprova o step.
        run: |
          set -euo pipefail
          : "${SUPABASE_ACCESS_TOKEN:?Configure o secret SUPABASE_ACCESS_TOKEN.}"
          : "${SUPABASE_PROJECT_REF:?Configure o secret SUPABASE_PROJECT_REF.}"
          : "${PR_HEAD_REF:?PR_HEAD_REF ausente}"
          supabase --experimental branches get "$PR_HEAD_REF" \
            --project-ref "$SUPABASE_PROJECT_REF" -o env | node scripts/load-branch-env.mjs

      - name: Provision test admin
        if: steps.readiness.outputs.readiness == 'ready'
        run: node scripts/provision-preview-admin.mjs
