name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

# Um PR só precisa do resultado do commit mais recente. Runs antigos do mesmo
# ref são cancelados para liberar runners e encurtar a fila.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Docs + Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Documentation
        run: npm run docs:check

      - name: Lint
        run: npm run lint

      - name: Squash generator self-check
        run: node scripts/build-squash-migrations.mjs --self-check

  build:
    name: Build + Bundle size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build (tsc + vite)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Bundle size budget
        run: npm run size-limit

  test:
    name: Test (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Test
        run: npm test -- --shard=${{ matrix.shard }}/3

  security-audit:
    name: Security guard replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify database security guards
        run: python scripts/security/verificar_guardas.py --ci

  # Aplica de verdade as migrations num Postgres 16 descartável. Docs, lint,
  # build, vitest e o replay estático leem o texto das migrations sem executar:
  # nenhum deles pegaria um apply que aborta (classe do bloqueante da PR 651,
  # pg_trgm fora de public) nem seeds que faltam. O Supabase Preview tampouco
  # serve de evidência, porque só aplica arquivos novos e 001–004 reaproveitam
  # prefixos já registrados.
  migration-replay:
    name: Migration replay (Postgres real)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure PostgreSQL 16 cluster
        run: |
          pg_lsclusters || true
          if ! pg_lsclusters 2>/dev/null | grep -q '^16'; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-16
          fi

      - name: Replay consolidated migrations from scratch
        run: sudo scripts/setup-local-pg.sh --reset

      - name: Assert replayed schema invariants
        # stdin (-) em vez de -f caminho: o usuário postgres do SO não tem
        # travessia no diretório do checkout (Permission denied com -f).
        # Mesmo padrão de scripts/setup-local-pg.sh:118 (< "$f").
        run: sudo -u postgres psql -d vela_test -v ON_ERROR_STOP=1 -q -f - < scripts/check-squash-replay.sql

      - name: Assert comunicados routing and NOB behaviour
        run: sudo -u postgres psql -d vela_test -v ON_ERROR_STOP=1 -q -f - < scripts/check-comunicados-caixas-nob.sql

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run SQL contract suites against the replayed database
        # Sem esta etapa os suites *.local-pg.test.ts eram `describe.skip` (a
        # variável nunca era definida) e todo contrato SQL desta remediação
        # ficava provado só na máquina de quem executou.
        #
        # --no-file-parallelism é obrigatório: os suites compartilham um único
        # banco e, em paralelo, um derruba a fixture do outro. Fixtures novas
        # devem usar ids e `customers.cnpj_cpf` do próprio namespace da suíte,
        # porque o CNPJ é UNIQUE e a limpeza remove por id.
        #
        # A lista é explícita, não `src/integration/`, porque estas suítes
        # compartilham um único banco e precisam de execução serializada.
        env:
          LOCAL_PG_INTEGRATION: '1'
          LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vela_test
        run: |
          npx vitest run --no-file-parallelism \
            src/integration/auditSecurityBoundaries.local-pg.test.ts \
            src/integration/communicationEligibility.local-pg.test.ts \
            src/integration/demurrageAuthority.local-pg.test.ts \
            src/integration/demurrageMoney.local-pg.test.ts \
            src/integration/emailInbox.local-pg.test.ts \
            src/integration/exchangeRateIntegrity.local-pg.test.ts \
            src/integration/importAtomicity.local-pg.test.ts \
            src/integration/importEffects.local-pg.test.ts \
            src/integration/localBillingIntegrity.local-pg.test.ts \
            src/integration/operationalLists.local-pg.test.ts \
            src/integration/portalInspectionParity.local-pg.test.ts \
            src/integration/rpcCatalog.local-pg.test.ts \
            src/integration/adminUsuarios.local-pg.test.ts \
            src/integration/agencyReportAlertsFoundation.local-pg.test.ts \
            src/integration/agencyReportCloserName.local-pg.test.ts \
            src/integration/alertsReviewHardening.local-pg.test.ts \
            src/integration/rpcFinalDefinition.local-pg.test.ts \
            src/integration/pr698ClaudeReview.local-pg.test.ts

      - name: Verify the executed RPC catalog
        # `npm run rpc:check` existia no package.json sem nenhum gate a executá-lo.
        env:
          LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vela_test
        run: npm run rpc:check

      - name: Apply seed on the replayed database
        # Supabase branches e `db reset` aplicam seed.sql automaticamente; sem
        # este passo, o caminho banco-novo+seed só era provado nos Previews,
        # nunca no gate da PR. Roda DEPOIS das asserções (elas são pré-seed).
        # O próprio seed.sql já aborta se tarifas (3/24/12) ou depots (9/4/50)
        # estiverem incompletos (B1 da revisão final: sem seed, 0/0/0).
        run: sudo -u postgres psql -d vela_test -v ON_ERROR_STOP=1 -q -f - < supabase/seed.sql

      - name: Log post-seed tariff counts
        # Evidência B1: bootstrap exige migrations + seed; migrations sozinhas
        # sobem sem tarifas. Só loga — a trava real está nas asserções do seed.
        run: sudo -u postgres psql -d vela_test -v ON_ERROR_STOP=1 -q -c "SELECT (SELECT count(*) FROM public.charge_tables) AS charge_tables, (SELECT count(*) FROM public.charge_table_items) AS charge_table_items, (SELECT count(*) FROM public.demurrage_rates) AS demurrage_rates;"

  # Gate único exigido pela proteção de branch: fica verde só quando todos os
  # jobs acima terminam verdes. Mantém um nome estável mesmo que os shards
  # mudem de quantidade.
  checks:
    name: checks
    runs-on: ubuntu-latest
    needs: [quality, build, test, security-audit, migration-replay]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          echo "quality: ${{ needs.quality.result }}"
          echo "build:   ${{ needs.build.result }}"
          echo "test:    ${{ needs.test.result }}"
          echo "security-audit: ${{ needs.security-audit.result }}"
          echo "migration-replay: ${{ needs.migration-replay.result }}"
          [ "${{ needs.quality.result }}" = "success" ] \
            && [ "${{ needs.build.result }}" = "success" ] \
            && [ "${{ needs.test.result }}" = "success" ] \
            && [ "${{ needs.security-audit.result }}" = "success" ] \
            && [ "${{ needs.migration-replay.result }}" = "success" ]
