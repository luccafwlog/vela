name: CI

permissions:
  contents: read

# Só em PR (ADR 0086): o merge na `main` não repete o CI. A produção publica no
# push e espera o Supabase aplicar as migrations (cloudflare-pages-production.yml).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Um PR só precisa do resultado do commit mais recente. Runs antigos do mesmo
# ref são cancelados para liberar runners e encurtar a fila.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # Um computador para tudo que não é teste nem banco: um só `npm ci`.
    name: Quality + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Documentation
        run: |
          node scripts/lib/docs-routes.test.mjs
          node scripts/lib/docs-adr.test.mjs
          node scripts/lib/docs-anchors.test.mjs
          node scripts/check-docs.test.mjs
          npm run docs:check

      - name: CI scripts
        run: npm run ci:test

      - name: Lint
        run: npm run lint

      - name: Visual identity (ADR 0081)
        run: |
          node scripts/check-design.test.mjs
          npm run design:check
          npm run a11y:contrast

      - name: CE document upload and cleanup contracts
        # O esm.sh às vezes derruba a conexão (main, 2026-10-13: "connection reset"
        # no import do supabase-js). Baixa as dependências antes, com até 3
        # tentativas; o teste roda só do cache, sem rede para os imports.
        # O deno.lock da raiz cobre só os imports remotos desse teste: sem
        # package.json nem deno.json, uma atualização de dependência npm ou do
        # import map das funções não invalida o lock (`--frozen`).
        env:
          DENO_NO_PACKAGE_JSON: "1"
        run: |
          deno_lock="--no-config --lock=deno.lock --frozen"
          for dir in supabase/functions/portal-ce-unlock-document supabase/functions/ce-unlock-cleanup; do
            for attempt in 1 2 3; do
              npx --yes deno@2.9.6 cache $deno_lock "$dir/index.ts" "$dir/index.test.ts" && break
              [ "$attempt" = 3 ] && exit 1
              echo "Download das dependências falhou ($attempt/3); nova tentativa em 10 s."
              sleep 10
            done
            npx --yes deno@2.9.6 test $deno_lock --cached-only --allow-env --allow-net "$dir/index.test.ts"
          done

      - name: Email Edge Functions type check and webhook contract
        # Plano de correção dos e-mails, 5.4: `deno check` das Edges de e-mail
        # e o handler do webhook com assinatura Svix gerada. Usa o manifesto e
        # o lock das funções (supabase/functions/deno.json e deno.lock), que
        # cobrem o @sentry/deno do wrapper de telemetria e os imports do esm.sh.
        # Mesmo esquema de download com nova tentativa do passo anterior.
        env:
          DENO_NO_PACKAGE_JSON: "1"
        run: |
          deno_flags="--config supabase/functions/deno.json --frozen"
          files=""
          for fn in portal-email-webhook portal-email-events-runner portal-invite-send portal-password-recovery \
                    portal-recovery-email-change portal-daily-digest ce-unlock-notify-email admin-users portal-password-reset \
                    send-customer-communication demurrage-dunning customer-communication-auto-runner; do
            files="$files supabase/functions/$fn/index.ts"
          done
          webhook_test=supabase/functions/portal-email-webhook/index.test.ts
          for attempt in 1 2 3; do
            npx --yes deno@2.9.6 cache $deno_flags $files $webhook_test && break
            [ "$attempt" = 3 ] && exit 1
            echo "Download das dependências falhou ($attempt/3); nova tentativa em 10 s."
            sleep 10
          done
          npx --yes deno@2.9.6 check $deno_flags --cached-only $files
          npx --yes deno@2.9.6 test $deno_flags --cached-only --allow-env --allow-net $webhook_test

      - name: Squash generator self-check
        run: node scripts/build-squash-migrations.mjs --self-check

      - name: Destructive migration declaration
        # Toda migration que reescreve ou apaga linhas depende da afirmação
        # "Data status" do AGENTS.md e tem de declarar isso no cabeçalho.
        run: npm run migrations:check

      - name: Local-pg suites listed in CI
        # Toda suíte `*.local-pg.test.ts` precisa estar no job db e na passada
        # invertida semanal (local-pg-order.yml).
        run: npm run localpg:check

      - name: Destructive migration check self-test
        run: node scripts/check-destructive-migrations.test.mjs

      - name: Cloudflare Pages artifact staging contract
        run: npm run cloudflare:stage:test

      - name: Cloudflare Pages provisioning contract
        run: npm run cloudflare:provision:test

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify database security guards
        run: |
          python -B -m unittest discover -s scripts/security -p 'test_*.py'
          python -B scripts/security/verificar_guardas.py --ci

      - name: Build Vite bundles and stage both Cloudflare Pages sites
        run: npm run cloudflare:build:sites
        env:
          # O stage exige a URL do projeto para o connect-src do CSP; PR sem
          # acesso a secrets (Dependabot) usa um projeto fictício.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://ciplaceholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Bundle size budget
        run: npm run size-limit

  test:
    name: Test (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Test
        run: npm test -- --shard=${{ matrix.shard }}/2

  # Aplica de verdade as migrations num Postgres 16 descartável. Docs, lint,
  # build, vitest e o replay estático leem o texto das migrations sem executar:
  # nenhum deles pegaria um apply que aborta (classe do bloqueante da PR 651,
  # pg_trgm fora de public) nem seeds que faltam. O Supabase Preview tampouco
  # serve de evidência, porque só aplica arquivos novos e 001–004 reaproveitam
  # prefixos já registrados.
  #
  # Schema, invariantes, catálogo de RPCs e seed rodam em toda PR. As suítes SQL
  # e a bateria financeira só quando o diff toca o banco (scripts/ci-db-paths.mjs,
  # ADR 0086); a condição fica nos passos, para o job nunca ser `skipped`.
  db:
    name: Database (Postgres real)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # O merge da PR e o seu primeiro pai (a base) bastam para o diff.
          fetch-depth: 2

      - name: Decide whether the SQL suites run
        id: paths
        run: git diff --name-only HEAD^1 HEAD | node scripts/ci-db-paths.mjs >> "$GITHUB_OUTPUT"

      - name: Ensure PostgreSQL 16 cluster
        run: |
          pg_lsclusters || true
          if ! pg_lsclusters 2>/dev/null | grep -q '^16'; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-16
          fi

      - name: Replay consolidated migrations from scratch
        run: sudo scripts/setup-local-pg.sh --reset

      - name: Assert replayed schema invariants
        # stdin (-) em vez de -f caminho: o usuário postgres do SO não tem
        # travessia no diretório do checkout (Permission denied com -f).
        # Mesmo padrão de scripts/setup-local-pg.sh:118 (< "$f").
        run: sudo -u postgres psql -d vela_test -v ON_ERROR_STOP=1 -q -f - < scripts/check-squash-replay.sql

      - name: Assert comunicados routing and NOB behaviour
        run: sudo -u postgres psql -d vela_test -v ON_ERROR_STOP=1 -q -f - < scripts/check-comunicados-caixas-nob.sql

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run SQL contract suites against the replayed database
        if: steps.paths.outputs.suites == 'true'
        # Sem esta etapa os suites *.local-pg.test.ts eram `describe.skip` (a
        # variável nunca era definida) e todo contrato SQL desta remediação
        # ficava provado só na máquina de quem executou.
        #
        # --no-file-parallelism é obrigatório: os suites compartilham um único
        # banco e, em paralelo, um derruba a fixture do outro. Fixtures novas
        # devem usar ids e `customers.cnpj_cpf` do próprio namespace da suíte,
        # porque o CNPJ é UNIQUE e a limpeza remove por id.
        #
        # A lista é explícita (scripts/local-pg-suites.txt), não
        # `src/integration/`, porque estas suítes compartilham um único banco e
        # precisam de execução serializada. O Vitest reordenaria os arquivos
        # (falhos e lentos primeiro); `npm run test:local-pg` os roda na ordem
        # da lista com o sequenciador do vite.config.ts. A bateria financeira
        # roda depois, sozinha, porque altera temporariamente o snapshot global
        # de PTAX e confere que nenhuma suíte deixou tarifa ou cálculo residual
        # (ordem explícita, Etapa 12 do plano de correção das importações).
        # `npm run localpg:check` falha quando surge um `*.local-pg.test.ts`
        # fora da lista e dos passos deste job. A passada em ordem invertida,
        # num banco recriado, roda uma vez por semana (local-pg-order.yml).
        #
        # Sonda de pré-requisito com LOCAL_PG_INTEGRATION=1 falha o teste
        # (`describeWithProbe` em src/integration/localTestData.ts), em vez de
        # pular a suíte em silêncio.
        env:
          LOCAL_PG_INTEGRATION: '1'
          LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vela_test
        run: npm run test:local-pg

      - name: Run the financial battery after the other suites
        if: steps.paths.outputs.suites == 'true'
        env:
          LOCAL_PG_INTEGRATION: '1'
          LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vela_test
        run: npx vitest run src/integration/financialBattery.local-pg.test.ts

      - name: Verify the executed RPC catalog
        # `npm run rpc:check` existia no package.json sem nenhum gate a executá-lo.
        env:
          LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vela_test
        run: npm run rpc:check

      - name: Apply seed on the replayed database
        # Supabase branches e `db reset` aplicam seed.sql automaticamente; sem
        # este passo, o caminho banco-novo+seed só era provado nos Previews,
        # nunca no gate da PR. Roda DEPOIS das asserções (elas são pré-seed).
        # O próprio seed.sql já aborta se tarifas (3/24/12) ou depots (9/4/50)
        # estiverem incompletos (B1 da revisão final: sem seed, 0/0/0).
        run: sudo -u postgres psql -d vela_test -v ON_ERROR_STOP=1 -q -f - < supabase/seed.sql

      - name: Log post-seed tariff counts
        # Evidência B1: bootstrap exige migrations + seed; migrations sozinhas
        # sobem sem tarifas. Só loga — a trava real está nas asserções do seed.
        run: sudo -u postgres psql -d vela_test -v ON_ERROR_STOP=1 -q -c "SELECT (SELECT count(*) FROM public.charge_tables) AS charge_tables, (SELECT count(*) FROM public.charge_table_items) AS charge_table_items, (SELECT count(*) FROM public.demurrage_rates) AS demurrage_rates;"

  # Gate único exigido pela proteção de branch: fica verde só quando todos os
  # jobs acima terminam verdes. Mantém um nome estável mesmo que os shards
  # mudem de quantidade.
  checks:
    name: checks
    runs-on: ubuntu-latest
    needs: [quality, test, db]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          echo "quality: ${{ needs.quality.result }}"
          echo "test:    ${{ needs.test.result }}"
          echo "db:      ${{ needs.db.result }}"
          [ "${{ needs.quality.result }}" = "success" ] \
            && [ "${{ needs.test.result }}" = "success" ] \
            && [ "${{ needs.db.result }}" = "success" ]
