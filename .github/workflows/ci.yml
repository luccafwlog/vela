name: CI

# Gate barato no GitHub. Lint, build, testes, guardas e o replay de migrations
# rodam na máquina de quem desenvolve (CLAUDE.md). Aqui fica uma passagem única
# por PR pronta. Push em main não repete o CI: o deploy de produção escuta o
# próprio push.

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

# Um PR só precisa do resultado do commit mais recente. Runs antigos do mesmo
# ref são cancelados para liberar runners e encurtar a fila.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # O filtro fica num job próprio para um PR só de docs pular o gate sem
  # deixar de reportar `checks`. paths-ignore no workflow inteiro omitiria
  # esse check e a proteção de branch ficaria pendente. A classificação
  # `migrations` sai no log do passo; o replay correspondente é local.
  changes:
    name: Paths filter
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Paths filter
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --name-only "$BASE_SHA" HEAD | node scripts/ci-path-filter.mjs >> "$GITHUB_OUTPUT"

  gate:
    name: Lint + build + test + security
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Documentation
        run: |
          node scripts/lib/docs-routes.test.mjs
          node scripts/lib/docs-adr.test.mjs
          node scripts/lib/docs-anchors.test.mjs
          node scripts/check-docs.test.mjs
          node scripts/ci-path-filter.test.mjs
          npm run docs:check

      - name: Lint
        run: npm run lint

      - name: Visual identity (ADR 0081)
        run: |
          node scripts/check-design.test.mjs
          npm run design:check
          npm run a11y:contrast

      - name: CE document upload contract
        # O esm.sh às vezes derruba a conexão (main, 2026-10-13: "connection reset"
        # no import do supabase-js). Baixa as dependências antes, com até 3
        # tentativas; o teste roda só do cache, sem rede para os imports.
        # O deno.lock da raiz cobre só os imports remotos desse teste: sem
        # package.json nem deno.json, uma atualização de dependência npm ou do
        # import map das funções não invalida o lock (`--frozen`).
        env:
          DENO_NO_PACKAGE_JSON: "1"
        run: |
          dir=supabase/functions/portal-ce-unlock-document
          deno_lock="--no-config --lock=deno.lock --frozen"
          for attempt in 1 2 3; do
            npx --yes deno@2.9.6 cache $deno_lock "$dir/index.ts" "$dir/index.test.ts" && break
            [ "$attempt" = 3 ] && exit 1
            echo "Download das dependências falhou ($attempt/3); nova tentativa em 10 s."
            sleep 10
          done
          npx --yes deno@2.9.6 test $deno_lock --cached-only --allow-env --allow-net "$dir/index.test.ts"

      - name: Squash generator self-check
        run: node scripts/build-squash-migrations.mjs --self-check

      - name: Destructive migration declaration
        # Toda migration que reescreve ou apaga linhas depende da afirmação
        # "Data status" do AGENTS.md e tem de declarar isso no cabeçalho.
        run: npm run migrations:check

      - name: Local-pg suites listed in CI
        # Toda suíte `*.local-pg.test.ts` precisa estar no replay local.
        run: npm run localpg:check

      - name: Destructive migration check self-test
        run: node scripts/check-destructive-migrations.test.mjs

      - name: Cloudflare Pages artifact staging contract
        run: npm run cloudflare:stage:test

      - name: Cloudflare Pages provisioning contract
        run: npm run cloudflare:provision:test

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Security guard replay
        run: |
          python -B -m unittest discover -s scripts/security -p 'test_*.py'
          python -B scripts/security/verificar_guardas.py --ci

      - name: Build Vite bundles and stage both Cloudflare Pages sites
        run: npm run cloudflare:build:sites
        env:
          # O stage exige a URL do projeto para o connect-src do CSP; PR sem
          # acesso a secrets (Dependabot) usa um projeto fictício.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://ciplaceholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Bundle size budget
        run: npm run size-limit

      - name: Test
        run: npm test

  # Gate único exigido pela proteção de branch. `skipped` no gate (PR só de
  # docs) conta como passou. O replay de migrations não é job daqui: roda no
  # gate local e, se faltasse, este agregador não teria como exigi-lo.
  # Cancelamento por concurrency não dispara este job: o run novo é quem reporta.
  checks:
    name: checks
    runs-on: ubuntu-latest
    needs: [changes, gate]
    if: ${{ !cancelled() && github.event.pull_request.draft == false }}
    steps:
      - name: Verify required jobs
        run: |
          set -euo pipefail
          changes="${{ needs.changes.result }}"
          gate="${{ needs.gate.result }}"
          echo "changes: $changes"
          echo "gate:    $gate"
          [ "$changes" = "success" ]
          case "$gate" in success|skipped) ;; *) exit 1 ;; esac
