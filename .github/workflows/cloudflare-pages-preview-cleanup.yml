name: Cloudflare Pages Preview Cleanup

# pull_request_target loads this workflow from the base branch. The job checks
# out only that trusted branch and never executes source from the closed PR.
on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.event.pull_request.head.repo.id == github.event.repository.id &&
      vars.CLOUDFLARE_PAGES_ACCESS_CONFIGURED == 'true'
    runs-on: ubuntu-latest
    # Environment sem restrição de branch: o dono recusou restringi-lo a main
    # em 2026-10-06 (auditoria run-2, #14; risco aceito). O código confiável
    # vem da branch padrão (pull_request_target e checkout dela), não do
    # environment.
    environment: cloudflare-pages
    steps:
      - name: Checkout trusted cleanup script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Delete only this PR branch's preview deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PR_PAGES_BRANCH: pr-${{ github.event.pull_request.number }}
        run: node scripts/cloudflare-pages-cleanup.mjs
