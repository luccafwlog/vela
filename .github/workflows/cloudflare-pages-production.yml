name: Cloudflare Pages Production

# Publica os dois sites no ambiente de produção do Cloudflare Pages a cada push
# em `main`. O CI não roda de novo depois do merge (ADR 0086): a PR já foi
# conferida. Antes de publicar, espera a integração do Supabase aplicar as
# migrations do commit (scripts/wait-supabase-migrations.mjs). O disparo manual
# publica sem esperar: é a saída de quem já conferiu no painel do Supabase.
# Fica desligado até a variável de repositório CLOUDFLARE_PAGES_PRODUCTION_ENABLED
# ser `true` (roteiro
# docs/archive/plans/2026-09-24-configuracao-servicos-e-migracao-cloudflare.md,
# etapa 8).
# Só roda código da própria `main`; nenhum código de PR chega a este workflow.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      vars.CLOUDFLARE_PAGES_PRODUCTION_ENABLED == 'true' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: cloudflare-production
    permissions:
      contents: read
      checks: read
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Wait for Supabase to apply this commit's migrations
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/wait-supabase-migrations.mjs

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Refuse a build without production Supabase configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          : "${VITE_SUPABASE_URL:?Configure VITE_SUPABASE_URL no environment cloudflare-production}"
          : "${VITE_SUPABASE_ANON_KEY:?Configure VITE_SUPABASE_ANON_KEY no environment cloudflare-production}"

      - name: Build and stage both production sites
        run: npm run cloudflare:build:sites
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_PORTAL_URL: https://portalfwlog.com.br
          VITE_PORTAL_BILLING_URL: https://portalfwlog.com.br/portal/billing
          VITE_SENTRY_DSN_INTERNAL: ${{ vars.VITE_SENTRY_DSN_INTERNAL }}
          VITE_SENTRY_DSN_PORTAL: ${{ vars.VITE_SENTRY_DSN_PORTAL }}
          VITE_SENTRY_ENVIRONMENT: production
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_APP_COMMIT_SHA: ${{ github.sha }}

      - name: Publish Vela and Portal to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Configure o secret CLOUDFLARE_PAGES_API_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Configure a variável CLOUDFLARE_ACCOUNT_ID}"
          npx --no-install wrangler pages deploy dist/pages-internal \
            --project-name vela-internal --branch main --commit-hash "$COMMIT_SHA"
          npx --no-install wrangler pages deploy dist/pages-portal \
            --project-name vela-portal --branch main --commit-hash "$COMMIT_SHA"

      # Chunk inexistente não pode virar HTML cacheado como immutable
      # (incidente 2026-10-07; Function em functions/assets/[[path]].ts).
      - name: Check missing assets return uncached 404
        run: |
          set -euo pipefail
          for origin in https://vela.app.br https://portalfwlog.com.br; do
            headers="$(curl -sS -o /dev/null -D - "$origin/assets/nao-existe-${GITHUB_RUN_ID}.js")"
            printf '%s\n%s\n' "$origin" "$headers"
            grep -qE '^HTTP/[0-9.]+ 404' <<<"$headers" || { echo "::error::$origin/assets/* missing file is not 404"; exit 1; }
            ! grep -qi 'immutable' <<<"$headers" || { echo "::error::$origin/assets/* 404 is cached as immutable"; exit 1; }
          done
